name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      # 校验和、尺寸上限与许可证此前完全没进 CI，等于没有约束力。
      - name: Validate runtime assets
        run: pnpm assets:validate

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser journeys
        run: pnpm test:e2e

      - name: Upload native-resolution typography baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typography-960x540
          path: test-results/typography
          # if: always() 意味着这一步在 e2e 早期失败（装引擎、起 webServer）时也会跑，
          # 那时截图还一张都没产出；再配 error 就会在真正的原因旁边多叠一条误导性失败。
          # 而且截图只在 chromium project 里写，firefox/webkit 单独失败时目录同样是空的。
          if-no-files-found: ignore
          retention-days: 7

      # 失败诊断。仓库日志要 admin 权限才下得到，没有这份工件的话，一条只在 Linux 上
      # 复现的 e2e 失败在本机是查不动的——失败截图、错误上下文和首次重试的 trace 都在这里。
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
